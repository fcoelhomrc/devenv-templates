[project]
name = "template"
version = "0.1.0"
description = "Template for Python+Cuda projects"
requires-python = ">= 3.13"
dependencies = [
    "numpy>=2.5.1",
    "torch>=2.13.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'"}
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'"}
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
